<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create · LLMPORT AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="wm" style="font-size:20px">LLMPORT</span><span class="wm" style="font-size:13px;color:#6E3AFF;font-weight:600">.ai</span></a>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="credits"><i class="ti ti-coins" style="font-size:14px;vertical-align:-2px"></i> 18,240</span>
    <a class="pill" href="pricing.html">Upgrade</a>
    <span class="avatar">L</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <a class="nav" href="index.html"><i class="ti ti-home"></i>Home</a>
    <a class="nav active" href="create.html"><i class="ti ti-sparkles"></i>Create</a>
    <a class="nav" href="tools.html"><i class="ti ti-tool"></i>Tools</a>
    <a class="nav" href="models.html"><i class="ti ti-box"></i>Models</a>
    <a class="nav" href="creations.html"><i class="ti ti-folder"></i>My Creations</a>
    <div class="sdiv"></div>
    <div class="sgroup">Developers</div>
    <a class="nav" href="api.html"><i class="ti ti-api"></i>API Console</a>
    <a class="nav" href="#"><i class="ti ti-file-text"></i>Docs</a>
  </aside>

  <main class="main" style="display:flex;padding:0">
    <div style="width:280px;flex-shrink:0;padding:18px;border-right:0.5px solid #1d1d22">
      <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
        <span style="font-size:12px;padding:7px 12px;border-radius:999px;background:#6E3AFF;color:#fff">Text to Video</span>
        <span style="font-size:12px;padding:7px 12px;border-radius:999px;border:0.5px solid #2a2a30;color:#9a9aa2">Image to Video</span>
        <span style="font-size:12px;padding:7px 12px;border-radius:999px;border:0.5px solid #2a2a30;color:#9a9aa2">Reference</span>
      </div>
      <div class="lbl">Model</div>
      <div class="sel" style="margin-bottom:14px"><span id="modelName">Kling 3.0 · pro</span><i class="ti ti-chevron-down"></i></div>
      <div id="modelNote" style="display:none;font-size:12px;color:#c3b2ff;margin:-8px 0 14px"><i class="ti ti-circle-check" style="font-size:13px;vertical-align:-2px"></i> 已从模型页选用</div>
      <div class="lbl">Prompt</div>
      <textarea class="dk" rows="4" style="margin-bottom:10px">一瓶精华液在大理石台面上缓慢旋转，柔和的影棚灯光，景深虚化背景。</textarea>
      <div style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9a9aa2;border:0.5px dashed #2a2a30;border-radius:8px;padding:8px 12px;margin-bottom:16px"><i class="ti ti-photo-plus" style="font-size:15px"></i>添加起始帧（可选）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px">
        <div><div class="lbl">时长</div><div class="sel" style="padding:8px 9px;font-size:12px"><span>5s</span><i class="ti ti-chevron-down"></i></div></div>
        <div><div class="lbl">比例</div><div class="sel" style="padding:8px 9px;font-size:12px"><span>9:16</span><i class="ti ti-chevron-down"></i></div></div>
        <div><div class="lbl">画质</div><div class="sel" style="padding:8px 9px;font-size:12px"><span>1080p</span><i class="ti ti-chevron-down"></i></div></div>
      </div>
      <button class="btn-primary" style="width:100%;padding:11px;font-size:14px"><i class="ti ti-sparkles" style="font-size:16px;vertical-align:-2px;margin-right:4px"></i>生成 · 消耗 24 Credits</button>
    </div>
    <div style="flex:1;min-width:0;padding:18px">
      <div style="aspect-ratio:16/10;background:#161619;border:0.5px solid #1d1d22;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5c5c64;font-size:13px;margin-bottom:14px">
        <i class="ti ti-player-play" style="font-size:30px;margin-bottom:8px"></i>结果预览
        <span style="font-size:12px;margin-top:4px">生成完成后在此播放与下载</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:13px;color:#9a9aa2">近期作品</span>
        <a href="creations.html" style="font-size:12px;color:#c3b2ff">查看全部</a>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        <div style="aspect-ratio:9/16;background:#1f1f25;border-radius:8px"></div>
        <div style="aspect-ratio:9/16;background:#1f1f25;border-radius:8px"></div>
        <div style="aspect-ratio:9/16;background:#1f1f25;border-radius:8px"></div>
        <div style="aspect-ratio:9/16;background:#1f1f25;border-radius:8px"></div>
      </div>
    </div>
  </main>
</div>

<script>
  var map = {
    "seedance-2.0":"Seedance 2.0 · 标准",
    "kling-3.0":"Kling 3.0 · pro",
    "veo-3.1":"Veo 3.1",
    "sora-2":"Sora 2",
    "hailuo-02":"Hailuo 02",
    "runway-gen4":"Runway Gen-4",
    "vidu-q3":"Vidu Q3",
    "luma-ray2":"Luma Ray 2"
  };
  var m = new URLSearchParams(location.search).get("model");
  if (m && map[m]) {
    document.getElementById("modelName").textContent = map[m];
    document.getElementById("modelNote").style.display = "block";
  }
</script>

</body>
</html>
